name: CI

on:
  push:
    branches: [ 'trunk', 'wip/**' ]
  pull_request:
    branches: [ 'trunk' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make all
        env:
          CGO_ENABLED: 1

      - name: Test
        run: make test
        env:
          CGO_ENABLED: 1

      - name: Vet
        run: make vet
