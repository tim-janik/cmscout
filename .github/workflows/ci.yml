# Lint: xclip -sel c < .github/workflows/ci.yml # https://rhysd.github.io/actionlint/

name: CI

on:
  push:
    branches: [ 'trunk', 'wip/**' ]
  pull_request:
    branches: [ 'trunk' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make all
        env:
          CGO_ENABLED: 1

      - name: Test
        run: make test
        env:
          CGO_ENABLED: 1

      - name: Vet
        run: make vet

  Ping-IRC:
    # Always run, announce tag and trunk pushes only
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
    - { uses: actions/checkout@v4, with: { fetch-depth: 0 } }
    - run: git fetch -f --tags  # Fix actions/checkout#290
    - name: Ping-IRC
      if: ${{ always() && !env.ACT }}  # IRCBOT_JOBS indicates 'success'
      env: { IRCBOT_JOBS: "${{ join(needs.*.result, ' ') }}" }
      run: .github/workflows/ircbot.py -q -j "#Anklang" -G
