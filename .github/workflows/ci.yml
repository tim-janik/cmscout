# Lint: xclip -sel c < .github/workflows/ci.yml # https://rhysd.github.io/actionlint/

name: CI

on:
  push:
    branches: [ 'trunk', 'wip/**' ]
    tags: [ 'v[0-9]*.[0-9]*' ]
  pull_request:
    branches: [ 'trunk' ]

permissions: { contents: read }

jobs:

  Build-And-Test:
    runs-on: ubuntu-24.04
    steps:
    - { uses: actions/checkout@v7, with: { fetch-depth: 0, fetch-tags: true } }
    - run: git fetch --force --tags     # Fix actions/checkout#290
    - { uses: actions/setup-go@v5, with: { go-version-file: go.mod } }
    - name: Check
      env:
        CHECK_BASE: '${{ github.event.pull_request.base.sha || github.event.before }}'
        CHECK_HEAD: '${{ github.event.pull_request.head.sha || github.sha }}'
      run: |
        if [[ $CHECK_BASE =~ ^0+$ ]]; then unset CHECK_BASE; fi
        make -w check
    - run: make -w distcheck
    - uses: actions/upload-artifact@v7
      with: { name: cmscout-Artifacts, path: artifacts/ }

  Release:
    if: github.ref_type == 'tag'        # constrained by on.push.tags
    needs: [ Build-And-Test ]
    permissions: { contents: write }    # allow github.token to create a release
    uses: tim-janik/release-kit/.github/workflows/release.yml@trunk
    with:
      docker-image: 'cimg/go:1.25.14@sha256:8d128f13dfe2b603924b2d9c3d30e8fae864a4e0f40cf1abd7a53bea7e270afc'
      docker-env: 'GOTOOLCHAIN=local GOFLAGS=-mod=readonly'

  Ping-IRC:
    # Announce tag and trunk pushes unless cancelled
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    needs: [ Build-And-Test, Release ]
    uses: tim-janik/release-kit/.github/workflows/ping-irc.yml@trunk
    with: { jobs: "${{ join(needs.*.result, ' ') }}" }
